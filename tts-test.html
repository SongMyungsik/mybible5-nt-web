<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 테스트</title>
<style>
  :root { --ink:#1b1340; --violet:#6B4EFF; --soft:#EFEAFF; --muted:#5b5675; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
         background:#fff; color:var(--ink); }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:6px 0; color:var(--muted); font-size:14px; line-height:1.5; }
  .box { background:var(--soft); border-radius:12px; padding:12px; margin:12px 0; }
  button { display:block; width:100%; margin:8px 0; padding:12px; border:0; border-radius:10px;
           background:var(--violet); color:#fff; font-size:16px; text-align:left; }
  button.alt { background:#2e7d32; }
  button.stop { background:#c62828; text-align:center; }
  code { font-size:13px; word-break:break-all; }
  li { margin:4px 0; font-size:14px; }
  .greek { font-weight:700; color:var(--violet); }
</style>
</head>
<body>
  <h1>헬라어 음성 테스트</h1>
  <p>버전 표시: <b>tts-test v4</b></p>
  <p>아래 버튼을 하나씩 눌러 보고, <b>어느 버튼이 "이우"처럼 한 단어로 읽는지</b> 알려 주세요.</p>

  <div class="box">
    <b>1. 아이폰이 웹에 제공하는 그리스어 음성</b>
    <ul id="greek"><li>불러오는 중…</li></ul>
    <p id="count"></p>
  </div>

  <div class="box">
    <b>2. 읽기 테스트</b>
    <button class="alt" id="english">0. 영어 확인 — "Hello, this is a test." (사파리 소리 자체가 나는지)</button>
    <div id="buttons"></div>
    <button class="alt" id="langOnly">언어만 지정(el-GR)하고 읽기 — υιού</button>
    <button class="alt" id="langOnlyPoly">언어만 지정(el-GR)하고 읽기 — υἱοῦ (원문 표기)</button>
    <button class="alt" id="sentence">문장 읽기 — Βίβλος γενέσεως Ιησού Χριστού</button>
    <p style="margin-top:14px"><b>3. 단어 하나를 다르게 넘겨 보기 (Melina)</b> — 어느 것이 "이우"로 읽히나요?</p>
    <button id="v1">A. 마침표 붙이기 — "υιού."</button>
    <button id="v2">B. 대문자로 시작 — "Υιού."</button>
    <button id="v3">C. 두 번 반복 — "υιού, υιού."</button>
    <button id="v4">D. 앞뒤 공백 — " υιού "</button>
    <button id="v5">E. 다른 단어 — "Χριστού."</button>
    <p style="margin-top:14px"><b>4. 추가 확인 (Melina)</b> — 각각 어떻게 읽히나요?</p>
    <button id="w1">F. 자음 있는 단어 — "υιός"</button>
    <button id="w2">G. 관사 하나 — "ο"</button>
    <button id="w3">H. 관사 — "οι"</button>
    <button id="w4">I. 그리스어 물음표 — "υιού;"</button>
    <button id="w5">J. 따옴표 — "«υιού»"</button>
    <button id="w6">K. 붙임표 — "υι-ού"</button>
    <button id="w7">L. 짧은 문장 속 — "του υιού"</button>
    <button class="stop" id="stop">멈춤</button>
  </div>

<script>
  const synth = window.speechSynthesis;
  const WORD = 'υιού';
  function speak(text, voice, lang) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (lang) u.lang = lang;
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.rate = 0.8;
    synth.speak(u);
  }
  function render() {
    const all = synth.getVoices();
    const greek = all.filter(v => v.lang.toLowerCase().replace('_','-').startsWith('el'));
    document.getElementById('count').textContent = '전체 음성 ' + all.length + '개 중 그리스어 ' + greek.length + '개';
    const ul = document.getElementById('greek');
    ul.innerHTML = greek.length ? '' : '<li>없음 — 웹 페이지에 그리스어 음성이 제공되지 않습니다.</li>';
    const btns = document.getElementById('buttons');
    btns.innerHTML = '';
    greek.forEach((v, i) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="greek">' + v.name + '</span> <code>' + v.lang + '</code>' +
        (v.localService ? ' (기기 내장)' : ' (온라인)') + (v.default ? ' [기본]' : '');
      ul.appendChild(li);
      const b = document.createElement('button');
      b.textContent = (i + 1) + '. ' + v.name + ' (' + (v.voiceURI || '').split('.').slice(-2).join('.') + ') 음성으로 문장 읽기';
      b.onclick = () => speak('Βίβλος γενέσεως Ιησού Χριστού υιού Δαυίδ', v);
      btns.appendChild(b);
    });
  }
  document.getElementById('english').onclick = () => {
    const v = synth.getVoices().find(v => v.lang.toLowerCase().startsWith('en'));
    speak('Hello, this is a test.', v || null, 'en-US');
  };
  document.getElementById('langOnly').onclick = () => speak(WORD, null, 'el-GR');
  document.getElementById('langOnlyPoly').onclick = () => speak('υἱοῦ', null, 'el-GR');
  document.getElementById('sentence').onclick = () => {
    const v = synth.getVoices().find(v => v.lang.toLowerCase().startsWith('el'));
    speak('Βίβλος γενέσεως Ιησού Χριστού', v || null, 'el-GR');
  };
  const mel = () => synth.getVoices().find(v => v.lang.toLowerCase().startsWith('el')) || null;
  const map = {w1:'υιός', w2:'ο', w3:'οι', w4:'υιού;', w5:'«υιού»', w6:'υι-ού', w7:'του υιού', v1:'υιού.', v2:'Υιού.', v3:'υιού, υιού.', v4:' υιού ', v5:'Χριστού.'};
  for (const id in map) document.getElementById(id).onclick = () => speak(map[id], mel(), 'el-GR');
  document.getElementById('stop').onclick = () => synth.cancel();
  render();
  synth.onvoiceschanged = render;
  setTimeout(render, 500);
  setTimeout(render, 1500);
</script>
</body>
</html>
